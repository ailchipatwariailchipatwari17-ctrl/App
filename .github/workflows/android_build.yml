name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Unzip Project Code
      run: |
        unzip -o docuscan-ai.zip -d .
        if [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ]; then
          FOUND=$(find . -maxdepth 2 -name "build.gradle*" -exec dirname {} \;)
          if [ -n "$FOUND" ]; then
            cp -r $FOUND/* . || true
          fi
        fi

    - name: Clean Gradle Caches
      run: |
        rm -rf ~/.gradle/caches/
        rm -rf ~/.gradle/daemon/

    - name: Setup Fresh Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 8.4

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon --no-build-cache --no-configuration-cache

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: "**/build/outputs/apk/debug/*.apk"
